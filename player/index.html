<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boring AceStream Player</title>
  <script src="mpegts.js"></script>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #111; color: #eee; padding: 1.5rem; }
    h1 { font-size: 1.2rem; margin-bottom: 1.2rem; letter-spacing: 0.04em; }
    .row { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; align-items: center; }
    label { font-size: 0.8rem; color: #aaa; width: 5rem; flex-shrink: 0; }
    input { flex: 1; background: #222; border: 1px solid #444; color: #eee; padding: 0.4rem 0.6rem; border-radius: 4px; font-size: 0.9rem; }
    .buttons { display: flex; gap: 0.5rem; margin-bottom: 1rem; align-items: center; flex-wrap: wrap; }
    button { background: #333; border: 1px solid #555; color: #eee; padding: 0.4rem 0.9rem; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
    button:hover { background: #444; }
    button.primary { background: #1a6fd4; border-color: #2280f0; }
    button.primary:hover { background: #2280f0; }
    button.danger { background: #7a1a1a; border-color: #a02020; }
    button.danger:hover { background: #a02020; }
    #castDevice { background: #222; border: 1px solid #444; color: #eee; padding: 0.4rem 0.6rem; border-radius: 4px; font-size: 0.9rem; }
    video { width: 100%; max-width: 900px; background: #000; border-radius: 4px; display: block; margin-bottom: 1rem; }
    pre { background: #1a1a1a; border: 1px solid #333; border-radius: 4px; padding: 0.75rem; font-size: 0.8rem; color: #9cf; white-space: pre-wrap; word-break: break-all; min-height: 2.5rem; max-height: 8rem; overflow-y: auto; }
    .label { font-size: 0.75rem; color: #888; margin-bottom: 0.25rem; }
    details.settings { margin-bottom: 0.75rem; }
    details.settings summary { cursor: pointer; font-size: 0.8rem; color: #aaa; padding: 0.25rem 0; user-select: none; }
    details.settings summary:hover { color: #ccc; }
    details.settings .row { margin-top: 0.5rem; margin-bottom: 0; }
    input[type="checkbox"] { flex: 0 0 auto; width: 1rem; height: 1rem; accent-color: #1a6fd4; }
    body.audio-mode video { display: none; }
    #audioPanel { display: flex; gap: 0.75rem; align-items: center; max-width: 900px; background: #1a1a1a; border: 1px solid #333; border-radius: 4px; padding: 0.9rem 1rem; margin-bottom: 1rem; }
    #audioPanel[hidden] { display: none; }
    .np-icon { color: #2280f0; font-size: 1.4rem; }
    .np-title { flex: 1; font-size: 0.9rem; color: #ccc; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>Boring AceStream Player</h1>

  <details class="settings">
    <summary>Settings</summary>
    <div class="row">
      <label for="engineHost">Engine host</label>
      <input id="engineHost" type="text" placeholder="acestream.apps.pixelman.me">
    </div>
    <div class="row">
      <label for="keepScreenOn">Keep screen on</label>
      <input id="keepScreenOn" type="checkbox">
    </div>
  </details>

  <div class="row">
    <label for="acestreamId">AceStream ID</label>
    <input id="acestreamId" type="text" placeholder="40-char content ID">
  </div>

  <div class="buttons">
    <button class="primary" id="btnPreview">Stream</button>
    <button id="btnListen">Listen</button>
    <button id="btnCast">Cast</button>
    <button class="danger" id="btnStop">Stop cast</button>
    <select id="castDevice" aria-label="Cast device"></select>
  </div>

  <video id="video" controls playsinline disableRemotePlayback></video>

  <div id="audioPanel" hidden>
    <span class="np-icon">&#9834;</span>
    <span id="npTitle" class="np-title">&mdash;</span>
    <button class="primary" id="btnAudioToggle">Pause</button>
    <button id="btnExitAudio">Show video</button>
  </div>

  <div class="label">Status</div>
  <pre id="status">Ready.</pre>

  <script>
    // ---- Config ------------------------------------------------------------

    const DEFAULT_HOST = 'acestream.apps.pixelman.me';

    // Casting goes through Home Assistant: the page POSTs to a webhook, an HA automation
    // calls media_player.play_media on the chosen Chromecast. Works the same on desktop and
    // mobile (the Web Sender SDK was dropped because it doesn't work on mobile browsers).
    const HA_CAST_WEBHOOK = 'https://hass.apps.pixelman.me/api/webhook/0615c2465c362a0efa0c23d7e574847e';
    const HA_STOP_WEBHOOK = 'https://hass.apps.pixelman.me/api/webhook/03cde423f9aade35142368190c9925b8';
    const CAST_DEVICES = ['basement-tv', 'living-room-tv', 'amp']; // must match the HA automation's devices map

    // ---- DOM + status ------------------------------------------------------

    const video = document.getElementById('video');
    const statusEl = document.getElementById('status');
    const idEl = document.getElementById('acestreamId');
    const hostEl = document.getElementById('engineHost');
    const wakeEl = document.getElementById('keepScreenOn');
    const deviceEl = document.getElementById('castDevice');
    const audioPanel = document.getElementById('audioPanel');
    const npTitle = document.getElementById('npTitle');
    const btnAudioToggle = document.getElementById('btnAudioToggle');

    function log(msg) {
      statusEl.textContent = msg;
      console.log('[cast.html]', msg);
    }

    // ---- Settings (all localStorage access lives here) ----------------------
    // Text inputs persist when their value is used (a button click), not per
    // keystroke. A cleared AceStream ID or engine host keeps the previously
    // saved value on reload.

    const settings = {
      load() {
        idEl.value = localStorage.getItem('acestreamId') || '';
        hostEl.value = localStorage.getItem('engineHost') || '';
        wakeEl.checked = localStorage.getItem('keepScreenOn') === 'true';
        const device = localStorage.getItem('castDevice');
        if (device && CAST_DEVICES.includes(device)) deviceEl.value = device;
      },
      id() {
        const id = idEl.value.trim();
        if (!id) return null;
        localStorage.setItem('acestreamId', id);
        return id;
      },
      engineHost() {
        const host = hostEl.value.trim();
        if (host) {
          localStorage.setItem('engineHost', host);
          return host;
        }
        return DEFAULT_HOST;
      },
      saveKeepScreenOn() { localStorage.setItem('keepScreenOn', wakeEl.checked); },
      saveCastDevice() { localStorage.setItem('castDevice', deviceEl.value); },
    };

    // ---- Stream URLs ---------------------------------------------------------

    // The engine treats getstream requests without distinct player ids (pid) as the same
    // session and stops serving the old one when a new request arrives, so every client
    // gets its own. Per-playback (not per-device) so two tabs don't collide. No
    // crypto.randomUUID: the page runs over plain HTTP where it's unavailable.
    function newPid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }

    function tsUrl(id) { return `http://${settings.engineHost()}/ace/getstream?id=${id}&pid=${newPid()}`; }

    // acestream-audio transcoder (github.com/trexx/docker-acestream-audio): strips video
    // server-side for Listen and audio-only cast targets. Path-routed on the engine
    // host (the ingress sends /audio to the transcoder), so it needs no own setting.
    function audioUrl(id) { const host = settings.engineHost(); return `http://${host}/audio?id=${id}&host=${host}`; }

    // ---- Playback ------------------------------------------------------------
    // Both modes share the <video> element: 'mse' plays the live muxed TS through
    // mpegts.js, 'direct' points src straight at the transcoder's audio stream.

    const playback = {
      player: null, // mpegts.js instance (mse mode only)

      startMse(url) {
        if (!mpegts.getFeatureList().mseLivePlayback) {
          log('MSE live playback not supported in this browser.');
          return false;
        }
        this.player = mpegts.createPlayer(
          { type: 'mpegts', isLive: true, url },
          {
            enableWorker: true,           // demux/remux off the main thread
            enableWorkerForMSE: true,     // also use worker for MSE updates (default false, main thread)
            enableStashBuffer: false      // ~384KB input-side cushion against fetch-side jitter
          }
        );
        this.player.on(mpegts.Events.ERROR, (type, detail) => {
          log('mpegts.js error: ' + type + ' / ' + JSON.stringify(detail));
        });
        this.player.attachMediaElement(video);
        this.player.load();
        this.player.play().catch(e => log('play() rejected: ' + e.message));
        return true;
      },

      startDirect(url) {
        video.src = url;
        video.play().catch(e => log('play() rejected: ' + e.message));
      },

      stop() {
        if (this.player) {
          this.player.pause();
          this.player.unload();
          this.player.detachMediaElement();
          this.player.destroy();
          this.player = null;
        } else if (video.src) {
          // direct-src teardown — mpegts handles its own element state above
          video.pause();
          video.removeAttribute('src');
          video.load();
        }
      },
    };

    // ---- Audio mode / Media Session -------------------------------------------
    // Listen hides the video element and shows the now-playing panel. The active
    // Media Session gives lock-screen/car controls and exempts the page from
    // background-tab throttling, keeping audio alive while the phone is locked.

    function enterAudioMode(label) {
      document.body.classList.add('audio-mode');
      audioPanel.hidden = false;
      npTitle.textContent = label;
      if (!('mediaSession' in navigator)) return;
      navigator.mediaSession.metadata = new MediaMetadata({ title: label, artist: 'AceStream' });
      navigator.mediaSession.setActionHandler('play', () => video.play());
      navigator.mediaSession.setActionHandler('pause', () => video.pause());
      navigator.mediaSession.setActionHandler('stop', () => {
        playback.stop();
        exitAudioMode();
        log('Stopped.');
      });
    }

    function exitAudioMode() {
      document.body.classList.remove('audio-mode');
      audioPanel.hidden = true;
      if ('mediaSession' in navigator) navigator.mediaSession.metadata = null;
    }

    // ---- Wake lock -------------------------------------------------------------
    // Opt-in, for a mounted phone that should keep its display on. It cannot keep a
    // locked page awake (the OS releases it on lock) — Media Session covers that case.

    let wakeLock = null;
    async function applyWakeLock() {
      const want = wakeEl.checked && document.visibilityState === 'visible';
      if (want && !wakeLock && 'wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; });
        } catch (e) {
          log('Wake lock unavailable: ' + e.message);
        }
      } else if (!want && wakeLock) {
        wakeLock.release();
        wakeLock = null;
      }
    }

    // ---- HA casting --------------------------------------------------------------

    function haRequest(kind, webhook, body) {
      fetch(webhook, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      })
        .then(r => log(r.ok ? `${kind} request accepted (${body.device}).` : `${kind} request failed: HTTP ${r.status}.`))
        .catch(e => log(`${kind} request error: ` + e.message));
    }

    function cast(id, device) {
      log(`Casting to ${device} via HA…`);
      haRequest('Cast', HA_CAST_WEBHOOK, {
        id,
        host: settings.engineHost(),
        device,
        // pid: engine player id for the automation to append (&pid=) to the getstream URL;
        // stable per device, so re-casting to the same TV replaces its session.
        pid: device,
        // transcoder lets the HA automation cast audio-only targets (e.g. Chromecast Audio)
        // via http://<transcoder>/audio?id=…&host=… (AAC stream-copy) instead of the muxed
        // TS. Same value as host now that the transcoder is path-routed on the engine host.
        transcoder: settings.engineHost(),
      });
    }

    // ---- Wiring + init ---------------------------------------------------------

    for (const name of CAST_DEVICES) {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      deviceEl.appendChild(opt);
    }
    settings.load(); // after the <select> has its options, so the saved device applies

    document.getElementById('btnPreview').addEventListener('click', () => {
      const id = settings.id();
      if (!id) { log('Enter an AceStream ID first.'); return; }
      playback.stop();
      exitAudioMode();
      const url = tsUrl(id);
      if (playback.startMse(url)) log('Loading preview: ' + url);
    });

    document.getElementById('btnListen').addEventListener('click', () => {
      const id = settings.id();
      if (!id) { log('Enter an AceStream ID first.'); return; }
      playback.stop();
      // Server-side audio-only: plain <media> src, no MSE — a fraction of the data.
      const url = audioUrl(id);
      playback.startDirect(url);
      enterAudioMode(id);
      log('Listening (audio only): ' + url);
    });

    document.getElementById('btnCast').addEventListener('click', () => {
      const id = settings.id();
      if (!id) { log('Enter an AceStream ID first.'); return; }
      if (!deviceEl.value) { log('Pick a cast device first.'); return; }
      cast(id, deviceEl.value);
    });

    document.getElementById('btnStop').addEventListener('click', () => {
      if (!deviceEl.value) { log('Pick a cast device first.'); return; }
      haRequest('Stop', HA_STOP_WEBHOOK, { device: deviceEl.value });
    });

    btnAudioToggle.addEventListener('click', () => video.paused ? video.play() : video.pause());
    document.getElementById('btnExitAudio').addEventListener('click', exitAudioMode);

    video.addEventListener('play', () => {
      btnAudioToggle.textContent = 'Pause';
      if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
    });
    video.addEventListener('pause', () => {
      btnAudioToggle.textContent = 'Play';
      if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
    });
    video.addEventListener('error', () => {
      if (video.error) log('Media error: ' + (video.error.message || 'code ' + video.error.code));
    });

    wakeEl.addEventListener('change', () => {
      settings.saveKeepScreenOn();
      if (wakeEl.checked && !('wakeLock' in navigator)) log('Screen wake lock not supported here (needs HTTPS).');
      applyWakeLock();
    });
    document.addEventListener('visibilitychange', applyWakeLock);

    deviceEl.addEventListener('change', () => settings.saveCastDevice());

    applyWakeLock();
  </script>
</body>
</html>
