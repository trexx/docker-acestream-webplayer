<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boring AceStream Player</title>
  <script src="mpegts.js"></script>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #111; color: #eee; padding: 1.5rem; }
    h1 { font-size: 1.2rem; margin-bottom: 1.2rem; letter-spacing: 0.04em; }
    .row { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; align-items: center; }
    label { font-size: 0.8rem; color: #aaa; width: 5rem; flex-shrink: 0; }
    input { flex: 1; background: #222; border: 1px solid #444; color: #eee; padding: 0.4rem 0.6rem; border-radius: 4px; font-size: 0.9rem; }
    .buttons { display: flex; gap: 0.5rem; margin-bottom: 1rem; align-items: center; flex-wrap: wrap; }
    button { background: #333; border: 1px solid #555; color: #eee; padding: 0.4rem 0.9rem; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
    button:hover { background: #444; }
    button.primary { background: #1a6fd4; border-color: #2280f0; }
    button.primary:hover { background: #2280f0; }
    button.danger { background: #7a1a1a; border-color: #a02020; }
    button.danger:hover { background: #a02020; }
    #castDevice { background: #222; border: 1px solid #444; color: #eee; padding: 0.4rem 0.6rem; border-radius: 4px; font-size: 0.9rem; }
    video { width: 100%; max-width: 900px; background: #000; border-radius: 4px; display: block; margin-bottom: 1rem; }
    pre { background: #1a1a1a; border: 1px solid #333; border-radius: 4px; padding: 0.75rem; font-size: 0.8rem; color: #9cf; white-space: pre-wrap; word-break: break-all; min-height: 2.5rem; max-height: 8rem; overflow-y: auto; }
    .label { font-size: 0.75rem; color: #888; margin-bottom: 0.25rem; }
    details.settings { margin-bottom: 0.75rem; }
    details.settings summary { cursor: pointer; font-size: 0.8rem; color: #aaa; padding: 0.25rem 0; user-select: none; }
    details.settings summary:hover { color: #ccc; }
    details.settings .row { margin-top: 0.5rem; margin-bottom: 0; }
  </style>
</head>
<body>
  <h1>Boring AceStream Player</h1>

  <details class="settings">
    <summary>Settings</summary>
    <div class="row">
      <label for="engineHost">Engine host</label>
      <input id="engineHost" type="text" placeholder="acestream.apps.pixelman.me">
    </div>
  </details>

  <div class="row">
    <label for="acestreamId">AceStream ID</label>
    <input id="acestreamId" type="text" placeholder="40-char content ID">
  </div>

  <div class="buttons">
    <button class="primary" id="btnPreview">Stream</button>
    <button id="btnCast">Cast</button>
    <button class="danger" id="btnStop">Stop cast</button>
    <select id="castDevice" aria-label="Cast device"></select>
  </div>

  <video id="video" controls disableRemotePlayback></video>

  <div class="label">Status</div>
  <pre id="status">Ready.</pre>

  <script>
    const video = document.getElementById('video');
    const statusEl = document.getElementById('status');
    const idEl = document.getElementById('acestreamId');
    const hostEl = document.getElementById('engineHost');
    const deviceEl = document.getElementById('castDevice');
    const DEFAULT_HOST = 'acestream.apps.pixelman.me';

    // Casting goes through Home Assistant: the page POSTs to a webhook, an HA automation
    // calls media_player.play_media on the chosen Chromecast. Works the same on desktop and
    // mobile (the Web Sender SDK was dropped because it doesn't work on mobile browsers).
    const HA_CAST_WEBHOOK = 'https://hass.apps.pixelman.me/api/webhook/0615c2465c362a0efa0c23d7e574847e';
    const HA_STOP_WEBHOOK = 'https://hass.apps.pixelman.me/api/webhook/03cde423f9aade35142368190c9925b8';
    const CAST_DEVICES = ['basement-tv', 'living-room-tv']; // must match the HA automation's devices map

    idEl.value = localStorage.getItem('acestreamId') || '';
    hostEl.value = localStorage.getItem('engineHost') || '';

    function log(msg) {
      statusEl.textContent = msg;
      console.log('[cast.html]', msg);
    }

    function getId() {
      const id = idEl.value.trim();
      if (!id) return null;
      localStorage.setItem('acestreamId', id);
      return id;
    }

    function getHost() {
      const host = hostEl.value.trim();
      if (host) {
        localStorage.setItem('engineHost', host);
        return host;
      }
      return DEFAULT_HOST;
    }

    function tsUrl(id) { return `http://${getHost()}/ace/getstream?id=${id}`; }

    function populateDevices() {
      for (const name of CAST_DEVICES) {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        deviceEl.appendChild(opt);
      }
      const saved = localStorage.getItem('castDevice');
      if (saved && CAST_DEVICES.includes(saved)) deviceEl.value = saved;
      deviceEl.addEventListener('change', () => localStorage.setItem('castDevice', deviceEl.value));
    }

    populateDevices();

    // mpegts.js preview
    let player = null;

    function destroyPlayer() {
      if (!player) return;
      player.pause();
      player.unload();
      player.detachMediaElement();
      player.destroy();
      player = null;
    }

    document.getElementById('btnPreview').addEventListener('click', () => {
      const id = getId();
      if (!id) { log('Enter an AceStream ID first.'); return; }
      const url = tsUrl(id);

      destroyPlayer();

      if (!mpegts.getFeatureList().mseLivePlayback) {
        log('MSE live playback not supported in this browser.');
        return;
      }

      player = mpegts.createPlayer(
        { type: 'mpegts', isLive: true, url },
        {
          enableWorker: true,           // demux/remux off the main thread (matches index.html)
          enableWorkerForMSE: true,     // also use worker for MSE updates (default false, main thread)
          enableStashBuffer: false      // ~384KB input-side cushion against fetch-side jitter
        }
      );

      player.on(mpegts.Events.ERROR, (type, detail) => {
        log('mpegts.js error: ' + type + ' / ' + JSON.stringify(detail));
      });

      player.attachMediaElement(video);
      player.load();
      player.play().catch(e => log('play() rejected: ' + e.message));
      log('Loading preview: ' + url);
    });

    // Cast
    document.getElementById('btnCast').addEventListener('click', () => {
      const id = getId();
      if (!id) { log('Enter an AceStream ID first.'); return; }
      const device = deviceEl.value;
      if (!device) { log('Pick a cast device first.'); return; }
      log(`Casting to ${device} via HA…`);
      fetch(HA_CAST_WEBHOOK, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, host: getHost(), device }),
      })
        .then(r => log(r.ok ? `Cast request accepted (${device}).` : `Cast request failed: HTTP ${r.status}.`))
        .catch(e => log('Cast request error: ' + e.message));
    });

    // Stop
    document.getElementById('btnStop').addEventListener('click', () => {
      const device = deviceEl.value;
      if (!device) { log('Pick a cast device first.'); return; }
      fetch(HA_STOP_WEBHOOK, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ device }),
      })
        .then(r => log(r.ok ? `Stop request accepted (${device}).` : `Stop request failed: HTTP ${r.status}.`))
        .catch(e => log('Stop request error: ' + e.message));
    });
  </script>
</body>
</html>
