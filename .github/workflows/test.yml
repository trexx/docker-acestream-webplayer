name: 'Test'

on:
  push:
    branches: [ 'main' ]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 10
    permissions:
      contents: 'read'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      # The runner image ships google-chrome and Node 22; the test needs nothing else.
      - run: 'node test/flows.mjs'
        env:
          BROWSER_BIN: 'google-chrome'
