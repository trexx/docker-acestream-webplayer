name: 'Test'

on:
  push:
    branches: [ 'main' ]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: 'ubuntu-26.04'
    timeout-minutes: 10
    permissions:
      contents: 'read'
    steps:
      - uses: 'trexx/actions/.github/actions/checkout@shared-steps'
      # The runner image ships google-chrome and Node 22; the test needs nothing else.
      - run: 'node test/flows.mjs'
        env:
          BROWSER_BIN: 'google-chrome'
